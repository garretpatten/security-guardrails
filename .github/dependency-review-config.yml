# Dependency Review license policy
#
# This file configures the GitHub Dependency Review action used by the
# security-guardrails reusable workflow. It lists SPDX license identifiers
# that are forbidden in pull-request dependency changes.
#
# The list is sorted alphabetically and covers strong/weak copyleft,
# source-available, and other high-risk / business-restrictive licenses.
# Consumers may copy or override this file in their own repositories.
fail-on-severity: high
deny-licenses:
  - 'AGPL-1.0'
  - 'AGPL-1.0-only'
  - 'AGPL-1.0-or-later'
  - 'AGPL-3.0'
  - 'AGPL-3.0-only'
