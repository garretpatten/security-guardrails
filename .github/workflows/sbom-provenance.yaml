name: 'SBOM and Provenance'

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    name: 'CycloneDX SBOM + SLSA provenance'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3

      - name: 'Generate CycloneDX SBOM'
        uses: aquasecurity/trivy-action@314ff8b43182423b84c50b1670b0e10f858f2d98
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,license'
          format: 'cyclonedx'
          output: 'sbom.cyclonedx.json'
          trivyignores: '.trivyignore'

      - name: 'Upload SBOM artifact'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e682988f031c1facdb
        with:
          name: cyclonedx-sbom
          path: sbom.cyclonedx.json
          retention-days: 90

      - name: 'Attest SBOM (SLSA)'
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b
        with:
          subject-path: sbom.cyclonedx.json
          sbom-path: sbom.cyclonedx.json

      - name: 'Attest build provenance (SLSA)'
        # yamllint disable-line rule:line-length
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: sbom.cyclonedx.json
